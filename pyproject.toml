[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doubao2api"
dynamic = ["version"]
description = "豆包逆向API - OpenAI兼容的聊天/图片/视频/音乐生成服务"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "SeiShonagon520" },
]
keywords = ["doubao", "豆包", "openai", "api", "reverse-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "aiohttp>=3.9",
    "fastapi>=0.100",
    "httpx>=0.27",
    "playwright>=1.40.0",
    "playwright-stealth>=2.0.0",
    "Pillow>=10.0.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.20",
]

[project.urls]
Homepage = "https://github.com/SeiShonagon520/doubao2api"
Repository = "https://github.com/SeiShonagon520/doubao2api"
Issues = "https://github.com/SeiShonagon520/doubao2api/issues"

[project.scripts]
doubao2api = "doubao2api.__main__:main"

[project.optional-dependencies]
test = ["pytest>=7.4.3"]

[tool.hatch.version]
path = "doubao2api/__init__.py"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "unit: Unit tests (fast, no browser, no network)",
    "integration: Integration tests (FastAPI TestClient)",
    "live: Live network probes (may require a running service, browser, and account)",
]

